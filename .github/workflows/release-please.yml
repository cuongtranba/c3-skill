name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Rebuild and publish an existing release tag (e.g. v11.14.3) instead of running release-please. Leave empty for a normal run.
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # A PAT, not GITHUB_TOKEN: GitHub raises no event for anything GITHUB_TOKEN
      # creates, so the Release PR would arrive with ci.yml never having run on it —
      # the one PR carrying release-please's own output, ungated.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Summary
        run: |
          {
            echo "## release-please"
            echo ""
            echo "- Release created: ${{ steps.release.outputs.release_created || 'false' }}"
            echo "- Tag: ${{ steps.release.outputs.tag_name || '(none)' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Chained explicitly rather than through `release: published`, so exactly one
  # build runs per release: under the PAT that event fires too, and a listener on
  # it would race this call over the same asset filenames.
  release-assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      # Lets release.yml's publish-npm job mint the OIDC token npm trusted
      # publishing exchanges. npm trusts this file, so every npm publish must
      # run under it.
      id-token: write
    secrets: inherit
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      publish_npm: true

  # Recovery: rebuild an existing release and publish its npm client when that
  # version is not on npm yet. It lives here, not in a release.yml dispatch,
  # because npm only accepts a publish from a run of this workflow.
  #   gh workflow run release-please.yml -f tag=v11.14.3
  republish:
    if: ${{ inputs.tag }}
    permissions:
      contents: write
      id-token: write
    secrets: inherit
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ inputs.tag }}
      publish_npm: true

name: Publish npm client

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moved:
    runs-on: ubuntu-latest
    steps:
      - name: Use the release workflow
        run: |
          echo "npm publishing is handled by .github/workflows/release.yml."
          echo "It publishes through npm trusted publishing (OIDC) and only from runs of release-please.yml."
          echo "To publish an existing tag: gh workflow run release-please.yml -f tag=vX.Y.Z"

name: Release

# Builds and uploads assets for a release that already exists. release-please
# owns tag and release creation; this workflow never creates either.
on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to build assets for, e.g. v11.10.0
        type: string
        required: true
      publish_npm:
        description: Publish the npm client if the registry does not already have this version.
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and re-upload assets for, e.g. v11.10.0
        type: string
        required: true
      publish_npm:
        description: Publish the npm client if the registry does not already have this version.
        type: boolean
        default: true
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      npm_package: ${{ steps.plan.outputs.npm_package }}
      should_publish_npm: ${{ steps.plan.outputs.should_publish_npm }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Plan release
        id: plan
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          PUBLISH_NPM: ${{ github.event_name == 'release' || inputs.publish_npm == true }}
        run: |
          set -euo pipefail

          if [ -z "$RELEASE_TAG" ]; then
            echo "no release tag to build for" >&2
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"

          # release-please's JSON updater silently no-ops on a jsonpath that
          # matches nothing, so the tag is only trustworthy once every surface is
          # re-checked against it. The surface list lives in the test, not here.
          C3_EXPECTED_VERSION="$VERSION" python3 scripts/test_release_version_surfaces.py

          PACKAGE_NAME="$(node -p "require('./packages/cli/package.json').name")"

          # Existence of this exact version, not the latest dist-tag, so a
          # re-dispatch of an already-published release is a no-op rather than a failure.
          SHOULD_PUBLISH_NPM=false
          if [ "$PUBLISH_NPM" = "true" ] && ! npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            SHOULD_PUBLISH_NPM=true
          fi

          {
            echo "version=$VERSION"
            echo "tag=$RELEASE_TAG"
            echo "npm_package=$PACKAGE_NAME"
            echo "should_publish_npm=$SHOULD_PUBLISH_NPM"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Release Plan"
            echo ""
            echo "- Version: $VERSION"
            echo "- Tag: $RELEASE_TAG"
            echo "- npm package: $PACKAGE_NAME"
            echo "- Publish npm: $SHOULD_PUBLISH_NPM"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.tag }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json

      - name: Install Linux packaging test dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Release version surfaces
        run: python3 scripts/test_release_version_surfaces.py

      - name: Go tests
        working-directory: cli
        run: |
          go build ./...
          go build -tags embedmodel ./...
          go test ./...

      - name: npm manager tests
        working-directory: packages/cli
        run: |
          npm ci
          npm test

      - name: Skill packaging tests
        run: python3 scripts/test_skill_release_packaging.py

  model-assets:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.tag }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Download pinned MiniLM assets
        working-directory: cli
        run: go run ./tools/semantic-assets --release-dir ../dist/model

      - name: Upload semantic assets
        uses: actions/upload-artifact@v6
        with:
          name: semantic-assets
          path: dist/model/*

  build:
    needs: [plan, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-14
            os: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      # Pinned to the tag: the caller's ref is main, which may already have moved
      # past the release, and the binary is stamped with the planned version.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.tag }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Build thin npm assets and skill binaries
        run: |
          bash scripts/build.sh \
            --version "${{ needs.plan.outputs.version }}" \
            --variant release \
            --os "${{ matrix.os }}" \
            --arch "${{ matrix.arch }}" \
            --out-dir dist/c3x

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: c3x-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/c3x/**/*

  release-assets:
    needs: [plan, build, model-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.tag }}

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist/artifacts

      - name: Assemble release assets
        run: |
          set -euo pipefail
          bash scripts/assemble_release_assets.sh \
            --version "${{ needs.plan.outputs.version }}" \
            --artifacts-dir dist/artifacts \
            --out-dir dist/release

      - name: Upload assets to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.plan.outputs.tag }}"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "error: release $TAG does not exist; release-please owns release creation" >&2
            exit 1
          fi
          gh release upload "$TAG" dist/release/* --clobber

      - name: Summary
        run: |
          {
            echo "## Release Summary"
            echo ""
            echo "- Version: ${{ needs.plan.outputs.version }}"
            echo "- Tag: ${{ needs.plan.outputs.tag }}"
            echo "- Assets: thin binaries, semantic assets, platform-neutral skill zip, per-platform full-fat and portable fat skill zips, checksums"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-npm:
    needs: [plan, test, release-assets]
    if: needs.plan.outputs.should_publish_npm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json

      - name: Publish ${{ needs.plan.outputs.npm_package }}
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ needs.plan.outputs.npm_package }}
        run: |
          set -euo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "error: NPM_TOKEN secret is not set, so $PACKAGE_NAME cannot be published" >&2
            echo "hint: create a granular-access npm token with publish rights on $PACKAGE_NAME and add it as the NPM_TOKEN repository secret" >&2
            exit 1
          fi

          npm ci

          if ! npm publish --access public; then
            echo "hint: the npm account behind NPM_TOKEN must own $PACKAGE_NAME or its scope; npm answers 404 for a name it will not let you write" >&2
            exit 1
          fi

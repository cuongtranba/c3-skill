<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C3 Architecture Explorer</title>
<style>
:root {
  --bone: #f8f7f4;
  --ink: #1c1f24;
  --ink-muted: #55606b;
  --ink-subtle: #8b95a1;
  --mint: #2fa89a;
  --mint-ink: #17564e;
  --mint-pale: #d8efeb;
  --hairline: #e5e7e9;
  --input-stroke: #d5d8dc;
  --raised-white: #ffffff;
  --panel-gray: #f1f0ec;
  --surface-hover: #ecebe7;
}
/*__C3_CSS__*/
</style>
</head>
<body>
  <canvas id="c3-canvas"></canvas>

  <!-- Top bar -->
  <div class="c3-topbar">
    <div class="c3-pill c3-brand">
      <span class="c3-logo"></span>
      <span class="c3-brand-name" id="c3-project-name">C3</span>
      <span class="c3-brand-sub">Architecture · C4 explorer</span>
    </div>
    <div class="c3-pill c3-controls">
      <div class="c3-levels" id="c3-levels">
        <button data-level="context">C1 · Context</button>
        <button data-level="container" class="active">C2 · Containers</button>
        <button data-level="component">C3 · Components</button>
      </div>
      <div class="c3-search-wrap">
        <span class="c3-search-icon">⌕</span>
        <input id="c3-search" type="text" placeholder="Search…" autocomplete="off" spellcheck="false">
      </div>
      <button class="c3-tl-toggle" id="c3-timeline-toggle" title="Replay the architecture timeline">⏱ Timeline</button>
    </div>
  </div>

  <!-- Container picker (component level) -->
  <div class="c3-containers" id="c3-containers"></div>

  <!-- Left legend -->
  <div class="c3-legend">
    <div class="c3-card">
      <div class="c3-card-title">Lifecycle · tap to filter</div>
      <div id="c3-status-legend"></div>
    </div>
    <div class="c3-card">
      <div class="c3-card-title">Edges</div>
      <div id="c3-edge-legend">
        <div class="c3-legend-row"><span class="c3-edge-swatch" style="background:#7c8794"></span>contains</div>
        <div class="c3-legend-row"><span class="c3-edge-swatch" style="background:#2fa89a"></span>uses</div>
        <div class="c3-legend-row"><span class="c3-edge-swatch" style="background:#d98a2b"></span>affects (change-unit)</div>
      </div>
    </div>
  </div>

  <!-- Detail panel -->
  <div class="c3-detail" id="c3-detail" hidden>
    <div class="c3-detail-head">
      <span class="c3-badge" id="c3-detail-badge">ENTITY</span>
      <span class="c3-lifecycle" id="c3-detail-lifecycle"></span>
      <button class="c3-close" id="c3-detail-close" aria-label="Close">✕</button>
    </div>
    <h2 class="c3-detail-title" id="c3-detail-title"></h2>
    <div class="c3-detail-body" id="c3-detail-body"></div>
  </div>

  <!-- Tooltip -->
  <div class="c3-tooltip" id="c3-tooltip" hidden></div>

  <!-- Breadcrumb -->
  <div class="c3-crumb" id="c3-crumb"></div>

  <!-- Timeline (movie mode) -->
  <div class="c3-timeline" id="c3-timeline" hidden>
    <button class="c3-tl-play" id="c3-tl-play" aria-label="Play">▶</button>
    <input type="range" id="c3-tl-scrub" min="0" max="0" value="0" step="1" aria-label="Timeline position">
    <select id="c3-tl-speed" aria-label="Playback speed">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
    </select>
    <div class="c3-tl-card" id="c3-tl-card"></div>
  </div>

  <!-- Hints -->
  <div class="c3-hints">
    <span><b>Drag</b> orbit</span>·<span><b>Scroll</b> zoom</span>·<span><b>Click</b> detail</span>·<span><b>Double-click</b> drill</span>
  </div>

  <!-- Loading -->
  <div class="c3-loading" id="c3-loading">
    <div class="c3-spinner"></div>
    <div>Assembling the architecture…</div>
  </div>

  <script>/*__C3_THREE__*/</script>
  <script>/*__C3_ORBIT__*/</script>
  <script>/*__C3_DATA__*/</script>
  <script>/*__C3_JS__*/</script>
</body>
</html>
